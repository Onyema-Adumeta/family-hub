pluginManagement {
  def nodeModulesDir = rootDir.parentFile.toString()
  def version = providers.exec {
    commandLine("node", "-e", "console.log(require('react-native/package.json').version);")
    environment("NODE_PATH", nodeModulesDir + "/node_modules")
  }.standardOutput.asText.get().trim()
  def (_, reactNativeMinor, reactNativePatch) = version.split("-")[0].tokenize('.').collect { it.toInteger() }
  def rnGradlePlugin = ["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json')"].execute(["NODE_PATH=${nodeModulesDir}/node_modules"], rootDir).text.trim()
  includeBuild(new File(rnGradlePlugin).getParentFile().toString())
  if(reactNativeMinor == 74 && reactNativePatch <= 3){
    includeBuild("react-settings-plugin")
  }
}
plugins { id("com.facebook.react.settings") }
def getRNMinorVersion() {
  def nodeModulesDir = rootDir.parentFile.toString()
  def version = providers.exec {
    commandLine("node", "-e", "console.log(require('react-native/package.json').version);")
    environment("NODE_PATH", nodeModulesDir + "/node_modules")
  }.standardOutput.asText.get().trim()
  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }
  return minor
}
if (getRNMinorVersion() >= 75) {
  extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    if (System.getenv('EXPO_UNSTABLE_CORE_AUTOLINKING') == '1') {
      println('\u001B[32mUsing expo-modules-autolinking as core autolinking source\u001B[0m')
      def command = [
        'node',
        '--no-warnings',
        '--eval',
        'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
        'react-native-config',
        '--json',
        '--platform',
        'android'
      ].toList()
      ex.autolinkLibrariesFromCommand(command)
    } else {
      ex.autolinkLibrariesFromCommand()
    }
  }
}
rootProject.name = 'Family Hub'
dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      def nodeModulesDir = rootDir.parentFile.toString()
      def rnPackage = ["node", "--print", "require.resolve('react-native/package.json')"].execute(["NODE_PATH=${nodeModulesDir}/node_modules"], rootDir).text.trim()
      from(files(new File(rnPackage, "../gradle/libs.versions.toml")))
    }
  }
}
def nodeModulesDir = rootDir.parentFile.toString()
apply from: new File(["node", "--print", "require.resolve('expo/package.json')"].execute(["NODE_PATH=${nodeModulesDir}/node_modules"], rootDir).text.trim(), "../scripts/autolinking.gradle");
useExpoModules()
if (getRNMinorVersion() < 75) {
  apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(["NODE_PATH=${nodeModulesDir}/node_modules"], rootDir).text.trim(), "../native_modules.gradle");
  applyNativeModulesSettingsGradle(settings)
}
include ':app'
includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(["NODE_PATH=${nodeModulesDir}/node_modules"], rootDir).text.trim()).getParentFile())